# CI: runs automatically on GitHub whenever code is pushed to main or a pull request is opened.
# It never deploys anything; it only tells you whether the code is healthy.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway Postgres, so row locks and full-text search run for real in the tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    # Fake values so Django can start. Tests run on the throwaway Postgres above,
    # so nothing here touches Supabase, Cloudinary or email.
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: sqlite:///ci
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the tests with coverage
        run: coverage run manage.py test

      - name: Check coverage stays at or above 80%
        run: coverage report

      # Production uses WhiteNoise's strict static storage, which crashes on a missing
      # file reference. This catches that before deploy.
      - name: Check static files collect cleanly
        run: python manage.py collectstatic --noinput
