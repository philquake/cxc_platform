{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account settings | compile/</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;700&family=Imbue:wght@400&display=swap">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=5">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="account-title">
            <a href="{% url 'home' %}" class="logo">compile/</a>
            <h1 id="account-title">Account settings</h1>
            <p class="intro">Update the details connected to your study account.</p>
            <form method="post" class="auth-form">
                {% csrf_token %}
                {% include "accounts/_form_fields.html" %}
                <button type="submit">Save changes</button>
            </form>
            <p class="switch-link"><a href="{% url 'password_change' %}">Change password</a></p>
            <p class="switch-link"><a href="{% url 'progress:dashboard' %}">Back to progress</a></p>
        </section>
    </main>
</body>
</html>
