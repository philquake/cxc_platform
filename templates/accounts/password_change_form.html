{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password | compile/</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@600&display=swap">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=4">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="change-password-title">
            <a href="{% url 'home' %}" class="logo">compile<span>/</span></a>
            <p class="eyebrow">Account security</p>
            <h1 id="change-password-title">Change password</h1>
            <form method="post" class="auth-form">
                {% csrf_token %}
                {% include "accounts/_form_fields.html" %}
                <button type="submit">Update password</button>
            </form>
            <p class="switch-link"><a href="{% url 'account' %}">Back to account settings</a></p>
        </section>
    </main>
</body>
</html>
