{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password | CXCStudy</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="change-password-title">
            <a href="{% url 'home' %}" class="logo">CXC<span>Study</span></a>
            <p class="eyebrow">ACCOUNT SECURITY</p>
            <h1 id="change-password-title">Change password</h1>
            <form method="post" class="auth-form">
                {% csrf_token %}
                {% for field in form %}
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
                    {{ field.errors }}
                {% endfor %}
                <button type="submit">Update password</button>
            </form>
            <p class="switch-link"><a href="{% url 'account' %}">Back to account settings</a></p>
        </section>
    </main>
</body>
</html>
