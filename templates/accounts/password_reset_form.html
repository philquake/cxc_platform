{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | CXCStudy</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="reset-title">
            <a href="{% url 'home' %}" class="logo">CXC<span>Study</span></a>
            <p class="eyebrow">ACCOUNT RECOVERY</p>
            <h1 id="reset-title">Reset your password</h1>
            <p class="intro">Enter the email address on your account and we will send a reset link.</p>
            <form method="post" class="auth-form">
                {% csrf_token %}
                {% for field in form %}
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                {% endfor %}
                <button type="submit">Send reset link</button>
            </form>
            <p class="switch-link"><a href="{% url 'login' %}">Back to log in</a></p>
        </section>
    </main>
</body>
</html>
