{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | compile/</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;700&family=Imbue:wght@400&display=swap">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=7">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="signup-title">
            <a href="{% url 'home' %}" class="logo">compile/</a>
            <h1 id="signup-title">Create your account</h1>
            <p class="intro">Build a study routine that keeps every lesson, quiz, and goal in one place.</p>

            <form method="post" class="auth-form">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <input type="text" name="website" value="" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
                {% include "accounts/_form_fields.html" %}
                <button type="submit">Create account</button>
            </form>

            <p class="switch-link">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
        </section>
        {% include "accounts/_auth_testimonial.html" %}
    </main>
</body>
</html>
