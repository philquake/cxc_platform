{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | compile/</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@600&display=swap">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=4">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="signup-title">
            <a href="{% url 'home' %}" class="logo">compile<span>/</span></a>
            <p class="eyebrow">Start learning</p>
            <h1 id="signup-title">Create your account</h1>
            <p class="intro">Build a study routine that keeps every lesson, quiz, and goal in one place.</p>

            <form method="post" class="auth-form">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                {% include "accounts/_form_fields.html" %}
                <button type="submit">Create account</button>
            </form>

            <p class="switch-link">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
        </section>
        {% include "accounts/_auth_aside.html" %}
    </main>
</body>
</html>
