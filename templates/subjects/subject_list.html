{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <h1 class="mb-4">Subjects</h1>

    <div class="row g-4">

        {% for subject in subjects %}

        <div class="col-md-6 col-lg-4">

            <div class="card h-100">

                <div class="card-body">

                    <h2 class="card-title h5">
                        {{ subject.name }}
                    </h2>

                    {% if subject.description %}
                        <p class="card-text">
                            {{ subject.description }}
                        </p>
                    {% endif %}

                    <a
                        href="{% url 'subjects:detail' subject.name|slugify %}"
                        class="btn btn-primary"
                    >
                        View Subject
                    </a>

                </div>

            </div>

        </div>

        {% empty %}

        <p>No subjects available.</p>

        {% endfor %}

    </div>

</div>

{% endblock %}
